[package]
name = "wakati"
version = "0.2.0"
edition = "2024"
authors = ["Hajime Nakagami <nakagami@gmail.com>"]
description = "DuckDB extension that splits Japanese morphemes and connects them with spaces"
license = "MIT"
repository = "https://github.com/nakagami/wakati"
readme = "README.md"
keywords = ["duckdb", "mecab", "japanese"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "wakati"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb-neo = { version = "0.20000.0", features = ["build-extension"] }
duckdb-loadable-macros = { version = "1.20000.0", features = ["neo"] }
awabi = "0.3.2"
